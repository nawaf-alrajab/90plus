<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>90+ | منصة كرة القدم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    /* ===== Variables ===== */
    :root {
      --ink-black: #000814;
      --prussian-blue: #001D3D;
      --regal-navy: #003566;
      --bus-yellow: #FFC300;
      --gold: #FFD60A;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100vh;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--ink-black);
      color: var(--white);
      font-family: "Cairo", sans-serif;
      overflow-x: hidden;
    }

    /* ===== Navbar ===== */
    .navbar {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 3rem;
      background-color: var(--ink-black);
      border-bottom: 2px solid var(--bus-yellow);
      transition: all 0.3s ease;
    }

    .navbar-logo {
      font-family: "Bebas Neue", sans-serif;
      font-size: 2.2rem;
      color: var(--bus-yellow);
      letter-spacing: 0.05em;
      cursor: pointer;
      user-select: none;
    }

    .navbar-links {
      display: flex;
      list-style: none;
      gap: 2.5rem;
    }

    .navbar-links a {
      color: var(--white);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      transition: color 0.2s ease;
      position: relative;
    }

    .navbar-links a:hover {
      color: var(--bus-yellow);
    }

    .navbar-links a::after {
      content: '';
      position: absolute;
      bottom: -6px;
      right: 0;
      width: 0;
      height: 2px;
      background-color: var(--bus-yellow);
      transition: width 0.3s ease;
    }

    .navbar-links a:hover::after {
      width: 100%;
    }

    /* زر القائمة للموبايل */
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--bus-yellow);
      font-size: 1.8rem;
      cursor: pointer;
    }

    /* ===== Hero Section ===== */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 2rem 2rem;
      text-align: center;
      position: relative;
    }

    .hero-logo {
      font-family: "Bebas Neue", sans-serif;
      color: var(--bus-yellow);
      font-size: clamp(5rem, 20vw, 16rem);
      line-height: 1;
      letter-spacing: 0.02em;
      user-select: none;
      text-shadow: 0 0 80px rgba(255, 195, 0, 0.4);
    }

    /* ===== Footer ===== */
    .footer {
      padding: 2rem;
      text-align: center;
      background-color: var(--ink-black);
      border-top: 2px solid var(--bus-yellow);
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
    }

    .footer span {
      color: var(--bus-yellow);
      font-weight: 700;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .navbar {
        padding: 1rem 1.5rem;
      }

      .navbar-links {
        display: none;
        position: absolute;
        top: 100%;
        right: 0;
        left: 0;
        flex-direction: column;
        background-color: var(--ink-black);
        padding: 1.5rem;
        gap: 1.2rem;
        border-bottom: 2px solid var(--bus-yellow);
      }

      .navbar-links.active {
        display: flex;
      }

      .menu-toggle {
        display: block;
      }
    }
  </style>
</head>
<body>

  <!-- ===== Navbar ===== -->
  <nav class="navbar">
    <div class="navbar-logo">+90</div>
    <ul class="navbar-links" id="navLinks">
      <li><a href="#home">الرئيسية</a></li>
      <li><a href="#about">عن الموقع</a></li>
      <li><a href="#contact">تواصل</a></li>
    </ul>
    <button class="menu-toggle" id="menuToggle">☰</button>
  </nav>

  <!-- ===== Hero Section ===== -->
  <section class="hero" id="home">
    <h1 class="hero-logo">+90</h1>
  </section>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <p>© 2026 <span>+90</span> - جميع الحقوق محفوظة</p>
  </footer>

  <!-- ===== JavaScript ===== -->
  <script>
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');

    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });

    document.querySelectorAll('.navbar-links a').forEach(link => {
      link.addEventListener('click', () => {
        navLinks.classList.remove('active');
      });
    });
  </script>

</body>
</html>
