<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>90+ | منصة كرة القدم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    /* ===== شاشة تسجيل الدخول ===== */
    .login-screen {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: linear-gradient(145deg, #000814 0%, #001428 50%, #000814 100%);
    }

    html.pre-authed .login-screen {
      display: none;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      background: rgba(0, 29, 61, 0.85);
      border: 2px solid var(--bus-yellow);
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(255, 195, 0, 0.15);
    }

    .login-card h2 {
      font-family: "Bebas Neue", sans-serif;
      font-size: 2.5rem;
      color: var(--bus-yellow);
      text-align: center;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }

    .login-card p.sub {
      text-align: center;
      color: rgba(255, 255, 255, 0.55);
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .login-field {
      margin-bottom: 1rem;
    }

    .login-field label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: var(--white);
    }

    .login-field input[type="email"],
    .login-field input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid rgba(255, 195, 0, 0.35);
      border-radius: 8px;
      background: rgba(0, 8, 20, 0.6);
      color: var(--white);
      font-family: inherit;
      font-size: 1rem;
    }

    .login-field input:focus {
      outline: none;
      border-color: var(--bus-yellow);
      box-shadow: 0 0 0 2px rgba(255, 195, 0, 0.2);
    }

    .login-remember {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      cursor: pointer;
      user-select: none;
      font-size: 0.95rem;
    }

    .login-remember input {
      width: 1.1rem;
      height: 1.1rem;
      accent-color: var(--bus-yellow);
    }

    .login-btn {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 8px;
      background: var(--bus-yellow);
      color: var(--ink-black);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(255, 195, 0, 0.35);
    }

    .login-error {
      color: #ff6b6b;
      font-size: 0.9rem;
      text-align: center;
      margin-top: 1rem;
      min-height: 1.4em;
    }

    #siteContent {
      display: none;
    }

    html.pre-authed #siteContent {
      display: block;
    }

    .nav-logout {
      background: transparent;
      border: 1px solid var(--bus-yellow);
      color: var(--bus-yellow);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 0.5rem;
    }

    .nav-logout:hover {
      background: rgba(255, 195, 0, 0.12);
    }

    /* ===== Variables ===== */
    :root {
      --ink-black: #000814;
      --prussian-blue: #001D3D;
      --regal-navy: #003566;
      --bus-yellow: #FFC300;
      --gold: #FFD60A;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100vh;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--ink-black);
      color: var(--white);
      font-family: "Cairo", sans-serif;
      overflow-x: hidden;
    }

    /* ===== Navbar ===== */
    .navbar {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 3rem;
      background-color: var(--ink-black);
      border-bottom: 2px solid var(--bus-yellow);
      transition: all 0.3s ease;
    }

    .navbar-logo {
      font-family: "Bebas Neue", sans-serif;
      font-size: 2.2rem;
      color: var(--bus-yellow);
      letter-spacing: 0.05em;
      cursor: pointer;
      user-select: none;
    }

    .navbar-end {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .navbar-links {
      flex: 1 1 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      list-style: none;
      gap: 0.65rem 1.25rem;
      min-width: 0;
    }

    .navbar-links > li {
      display: flex;
      align-items: center;
    }

    .navbar-links .hero-tab {
      font-size: 0.8rem;
      padding: 0.4rem 0.85rem;
      white-space: nowrap;
    }

    .navbar-links a {
      color: var(--white);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      transition: color 0.2s ease;
      position: relative;
    }

    .navbar-links a:hover {
      color: var(--bus-yellow);
    }

    .navbar-links a::after {
      content: '';
      position: absolute;
      bottom: -6px;
      right: 0;
      width: 0;
      height: 2px;
      background-color: var(--bus-yellow);
      transition: width 0.3s ease;
    }

    .navbar-links a:hover::after {
      width: 100%;
    }

    /* زر القائمة للموبايل */
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--bus-yellow);
      font-size: 1.8rem;
      cursor: pointer;
    }

    /* ===== Hero + محتوى التاب ===== */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 6rem 1.5rem 2rem;
      text-align: center;
      position: relative;
    }

    .hero-hub {
      flex: 0 0 auto;
      margin-bottom: 2rem;
    }

    .hero-tab {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.55rem 1.15rem;
      border: 2px solid rgba(255, 195, 0, 0.35);
      border-radius: 999px;
      background: rgba(0, 29, 61, 0.5);
      color: var(--white);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .hero-tab:hover {
      border-color: var(--bus-yellow);
      color: var(--bus-yellow);
    }

    .hero-tab.is-active {
      background: var(--bus-yellow);
      color: var(--ink-black);
      border-color: var(--bus-yellow);
      box-shadow: 0 0 24px rgba(255, 195, 0, 0.35);
    }

    .hero-logo {
      font-family: "Bebas Neue", sans-serif;
      color: var(--bus-yellow);
      font-size: clamp(5rem, 20vw, 16rem);
      line-height: 1;
      letter-spacing: 0.02em;
      user-select: none;
      text-shadow: 0 0 80px rgba(255, 195, 0, 0.4);
      margin: 0;
    }

    .tab-panels {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      flex: 1 1 auto;
    }

    .tab-panel {
      display: none;
      padding: 1.25rem 1rem 2rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 195, 0, 0.2);
      background: rgba(0, 29, 61, 0.35);
      text-align: right;
      color: rgba(255, 255, 255, 0.85);
      font-size: 1rem;
      line-height: 1.7;
    }

    .tab-panel.active {
      display: block;
    }

    .tab-panel h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--bus-yellow);
      margin-bottom: 0.75rem;
    }

    /* ===== Footer ===== */
    .footer {
      padding: 2rem;
      text-align: center;
      background-color: var(--ink-black);
      border-top: 2px solid var(--bus-yellow);
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
    }

    .footer span {
      color: var(--bus-yellow);
      font-weight: 700;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .navbar {
        padding: 1rem 1.5rem;
        flex-wrap: wrap;
        row-gap: 0.75rem;
      }

      .navbar-links {
        display: none;
        position: absolute;
        top: 100%;
        right: 0;
        left: 0;
        flex-direction: column;
        align-items: stretch;
        background-color: var(--ink-black);
        padding: 1.5rem;
        gap: 1rem;
        border-bottom: 2px solid var(--bus-yellow);
        max-width: none;
        margin: 0;
      }

      .navbar-links > li {
        justify-content: center;
      }

      .navbar-links .hero-tab {
        width: 100%;
        justify-content: center;
        text-align: center;
        font-size: 0.9rem;
        padding: 0.55rem 1rem;
      }

      .navbar-links.active {
        display: flex;
        width: 100%;
        flex: none;
      }

      .menu-toggle {
        display: block;
      }
    }
  </style>
  <!-- تجنّب ومضة شاشة الدخول إذا كانت الجلسة أو «تذكرني» فعّالة -->
  <script>
    (function () {
      try {
        if (
          sessionStorage.getItem("90plus_session") === "1" ||
          localStorage.getItem("90plus_remember") === "1"
        ) {
          document.documentElement.classList.add("pre-authed");
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- ===== شاشة تسجيل الدخول (تظهر قبل الموقع) ===== -->
  <div class="login-screen" id="loginScreen" aria-live="polite">
    <div class="login-card">
      <h2>+90</h2>
      <p class="sub">سجّل الدخول للمتابعة</p>
      <form id="loginForm" novalidate>
        <div class="login-field">
          <label for="loginEmail">البريد الإلكتروني</label>
          <input type="email" id="loginEmail" name="email" autocomplete="username" required dir="ltr" />
        </div>
        <div class="login-field">
          <label for="loginPassword">كلمة المرور</label>
          <input type="password" id="loginPassword" name="password" autocomplete="current-password" required />
        </div>
        <label class="login-remember">
          <input type="checkbox" id="loginRemember" name="remember" />
          <span>تذكرني على هذا الجهاز</span>
        </label>
        <button type="submit" class="login-btn">دخول</button>
        <p class="login-error" id="loginError" role="alert"></p>
      </form>
    </div>
  </div>

  <div id="siteContent">
  <!-- ===== Navbar ===== -->
  <nav class="navbar">
    <div class="navbar-logo">+90</div>
    <ul class="navbar-links" id="navLinks">
      <li><a href="#home">الرئيسية</a></li>
      <li>
        <button type="button" class="hero-tab is-active" data-tab="create" id="tab-create" aria-controls="panel-create" aria-pressed="true">إنشاء منشور</button>
      </li>
      <li>
        <button type="button" class="hero-tab" data-tab="posts" id="tab-posts" aria-controls="panel-posts" aria-pressed="false">المنشورات</button>
      </li>
      <li>
        <button type="button" class="hero-tab" data-tab="templates" id="tab-templates" aria-controls="panel-templates" aria-pressed="false">القوالب</button>
      </li>
      <li>
        <button type="button" class="hero-tab" data-tab="settings" id="tab-settings" aria-controls="panel-settings" aria-pressed="false">الإعدادات</button>
      </li>
      <li><a href="#about">عن الموقع</a></li>
      <li><a href="#contact">تواصل</a></li>
    </ul>
    <div class="navbar-end">
      <button type="button" class="nav-logout" id="navLogout" title="تسجيل الخروج">خروج</button>
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="القائمة">☰</button>
    </div>
  </nav>

  <!-- ===== Hero: الشعار + محتوى التاب (التابات في شريط التنقل) ===== -->
  <section class="hero" id="home">
    <div class="hero-hub">
      <!-- غيّر نص الشعار من هنا -->
      <h1 class="hero-logo">+90</h1>
    </div>

    <div class="tab-panels">
      <div class="tab-panel active" id="panel-create" role="region" aria-labelledby="tab-create">
        <h2>إنشاء منشور</h2>
        <p>منطقة إنشاء المنشور — أضف هنا الحقول والمحرر لاحقاً.</p>
      </div>
      <div class="tab-panel" id="panel-posts" role="region" aria-labelledby="tab-posts">
        <h2>المنشورات</h2>
        <p>قائمة المنشورات المحفوظة ستظهر هنا.</p>
      </div>
      <div class="tab-panel" id="panel-templates" role="region" aria-labelledby="tab-templates">
        <h2>القوالب</h2>
        <p>قوالب جاهزة للمنشورات.</p>
      </div>
      <div class="tab-panel" id="panel-settings" role="region" aria-labelledby="tab-settings">
        <h2>الإعدادات</h2>
        <p>تفضيلات التطبيق والحساب.</p>
      </div>
    </div>
  </section>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <p>© 2026 <span>+90</span> - جميع الحقوق محفوظة</p>
  </footer>
  </div>

  <!-- ===== JavaScript ===== -->
  <script>
    /* ——— بيانات الدخول المسموح بها (غيّر من هنا فقط) ———
       تحذير: الموقع ثابت (HTML) — لا تضع كلمة مرور حساسة هنا؛ أي مستخدم يقدر يقرأ الكود.
       للحماية الحقيقية لاحقاً استخدم خادماً ومصادقة حقيقية. */
    var AUTH_EMAIL = "nawafn.alrajab@gmail.com";
    var AUTH_PASSWORD = "20189492";
    var SESSION_KEY = "90plus_session";
    var REMEMBER_KEY = "90plus_remember";

    function showApp() {
      document.documentElement.classList.add("pre-authed");
    }

    function hideApp() {
      document.documentElement.classList.remove("pre-authed");
      try {
        sessionStorage.removeItem(SESSION_KEY);
        localStorage.removeItem(REMEMBER_KEY);
      } catch (e) {}
    }

    (function initLogin() {
      var form = document.getElementById("loginForm");
      var errEl = document.getElementById("loginError");
      if (!form) return;

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        errEl.textContent = "";
        var email = (document.getElementById("loginEmail").value || "").trim().toLowerCase();
        var pass = document.getElementById("loginPassword").value || "";
        var remember = document.getElementById("loginRemember").checked;

        if (email !== AUTH_EMAIL.toLowerCase() || pass !== AUTH_PASSWORD) {
          errEl.textContent = "البريد أو كلمة المرور غير صحيحة.";
          return;
        }

        try {
          sessionStorage.setItem(SESSION_KEY, "1");
          if (remember) {
            localStorage.setItem(REMEMBER_KEY, "1");
          } else {
            localStorage.removeItem(REMEMBER_KEY);
          }
        } catch (err) {
          errEl.textContent = "تعذر حفظ الجلسة في هذا المتصفح.";
          return;
        }

        showApp();
      });
    })();

    (function initHeroTabs() {
      var tabs = document.querySelectorAll(".hero-tab");
      var panelByTab = {
        create: document.getElementById("panel-create"),
        posts: document.getElementById("panel-posts"),
        templates: document.getElementById("panel-templates"),
        settings: document.getElementById("panel-settings")
      };

      function showTab(tabId) {
        tabs.forEach(function (btn) {
          var on = btn.getAttribute("data-tab") === tabId;
          btn.classList.toggle("is-active", on);
          btn.setAttribute("aria-pressed", on ? "true" : "false");
        });
        Object.keys(panelByTab).forEach(function (key) {
          var p = panelByTab[key];
          if (!p) return;
          var on = key === tabId;
          p.classList.toggle("active", on);
          p.setAttribute("aria-hidden", on ? "false" : "true");
        });
      }

      tabs.forEach(function (btn) {
        btn.addEventListener("click", function () {
          showTab(btn.getAttribute("data-tab"));
          var nl = document.getElementById("navLinks");
          if (nl) nl.classList.remove("active");
        });
      });

      showTab("create");
    })();

    document.getElementById("navLogout").addEventListener("click", function () {
      hideApp();
      var pwd = document.getElementById("loginPassword");
      var em = document.getElementById("loginEmail");
      if (pwd) pwd.value = "";
      document.getElementById("loginError").textContent = "";
      if (em) em.focus();
    });

    const menuToggle = document.getElementById("menuToggle");
    const navLinks = document.getElementById("navLinks");

    menuToggle.addEventListener("click", () => {
      navLinks.classList.toggle("active");
    });

    document.querySelectorAll(".navbar-links a").forEach((link) => {
      link.addEventListener("click", () => {
        navLinks.classList.remove("active");
      });
    });
  </script>

</body>
</html>
